---
- id: CHECK_NX
  title: Missing Non-Executable Memory Protection
  description: |
    Most modern CPUs protect against executing non-executable memory regions (heap, stack, etc). This is known either as `Non-eXecute (NX) or eXecute-Disable (XD)`. This protection reduces the areas an attacker can use to perform arbitrary code execution.
    An operating system with support for the NX bit may mark certain areas of memory as non-executable. The processor will then refuse to execute any code residing in these areas of memory. The general technique, known as executable space protection, also called Write XOR Execute, is used to prevent certain types of malicious software from taking over computers by inserting their code into another program's data storage area and running their own code from within this section; one class of such attacks is known as the buffer overflow attack.
    Do not disable this protection. Check and remove the below gcc flags.

    ```bash
    gcc -fno-stack-protector -z execstack
    ```
  severity: critical
  exe_types:
    - genericbinary
    - x86_64-executable
    - x86_64-exec
    - gobinary
    - PE32
    - PE64
    - dotnetbinary
    - MachO
    - mips-executable
- id: CHECK_OBJC_LOAD_METHODS
  title: Objective-C +load Methods Run Before Main
  description: |
    The binary registers non-lazy Objective-C classes (`__objc_nlclslist`),
    which means the Objective-C runtime executes their `+load` methods during
    image setup — before the application's `main` and with no caller in the
    code. That is a legitimate hook most apps use (analytics, crash
    reporters), but it is also the earliest code that runs in the process,
    invisible to entry-point-based review, and a classic persistence or
    environment-tamper point. Review what these classes initialize.
  severity: info
  exe_types:
    - MachO
    - genericbinary
- id: CHECK_TLS_CALLBACKS
  title: TLS Callbacks Run Before Main
  description: |
    The binary registers TLS callbacks, which the Windows loader executes
    during process and thread setup — before the application's `main` and
    with no caller in the code. This is the PE sibling of the Objective-C
    `+load` check: a legitimate hook (C runtimes, crash reporters and
    anti-tamper schemes use it), but also the earliest code that runs in the
    process, invisible to entry-point-based review, and a classic
    persistence, anti-debug or environment-tamper point. The
    `pre_main_execution` block in the metadata names the callbacks, states
    whether the TLS directory and callback array are writable, and lists the
    static initializers that also run before `main`. Review what these
    callbacks initialize.
  severity: info
  exe_types:
    - PE32
    - PE64
    # W3.1 (rule-15 exception): managed images used to hide from this rule
    # under PE32/PE64; a TLS callback on a pure-IL image would be exactly
    # the anomaly an info finding exists for, so the scope follows the type.
    - dotnetbinary
- id: CHECK_WX_SEGMENTS
  title: Writable and Executable Memory Segment
  description: |
    A loadable segment or section is mapped so that the same pages can be both written and executed. This breaks the Write XOR Execute (W^X) invariant: any memory-write primitive — a buffer overflow, a use-after-free, an unsafe deserialization routine — becomes direct code execution, because the pages the processor runs are the pages an attacker can modify.
    Such mappings usually come from the link or pack step rather than the source: a single RWX `PT_LOAD` in firmware and binaries processed by older packer releases, a linker script or `-z execstack` build marking every loadable segment read-write-execute, or PE sections carrying `MEM_WRITE` together with `MEM_EXECUTE` after processing by some packers and legacy linkers.
    Keep code segments read-only and executable (`R+X`) and data segments writable and non-executable (`R+W`). Runtime code generation and self-modifying code should write through a private writable mapping and only flip the executable view readable-executable for the duration of the update (`mprotect`/`VirtualProtect`), or use the JIT write-protection support provided by the runtime. `readelf -l` shows the offending segment as `LOAD ... RWE`; `objdump -h` and `dumpbin /headers` show the offending PE sections.
    Beyond exploit mitigation, keeping data non-executable matters for correctness on ARM: non-executable permission is the only mechanism that prevents speculative instruction fetches to a region, so executable data or MMIO mappings can be speculatively fetched by mispredicted indirect branches with unpredictable results on some SoCs.
  severity: critical
  exe_types:
    - genericbinary
    - x86_64-executable
    - x86_64-exec
    - gobinary
    - PE32
    - PE64
    - dotnetbinary
    - MachO
    - mips-executable
- id: CHECK_PIE
  title: Missing Position-Independent Executable (PIE) Protection
  description: |
    `Position-Independent Executable (PIE)` executes properly regardless of its absolute address. PIE binaries are used in some security-focused Linux distributions to allow PaX or Exec Shield to use address space layout randomization to prevent attackers from knowing where existing executable code is during a security attack using exploits that rely on knowing the offset of the executable code in the binary, such as return-to-libc attacks.
    Apple's macOS and iOS fully support PIE executables; a warning is issued when non-PIE iOS executables are submitted for approval to Apple's App Store.
    Android enabled support for PIEs in Jelly Bean and removed non-PIE linker support in Lollipop.
    For go binary builds, enable pie by specifying the buildmode=pie as described in the [documentation](https://pkg.go.dev/cmd/go#hdr-Build_modes). The below command line enables pie along with relro and other protections.

    ```bash
    go build -buildmode=pie -ldflags -extldflags=-Wl,-z,now,-z,relro
    ```
  severity: high
  exe_types:
    - genericbinary
    - x86_64-executable
    - x86_64-exec
    - gobinary
    - PE32
    - PE64
    - dotnetbinary
    - MachO
    - mips-executable
- id: CHECK_RELRO
  title: Missing Relocation Read-Only (RELRO) Protection
  description: |
    A dynamically linked ELF binary uses a look-up table called the Global Offset Table (GOT) to dynamically resolve functions that are located in shared libraries. Such calls point to the Procedure Linkage Table (PLT), which is present in the .plt section of the binary. The GOT is populated dynamically as the program is running. The first time a shared function is called, the GOT contains a pointer back to the PLT, where the dynamic linker is called to find the actual location of the function in question. Since GOT exists at a predefined place in memory, a program that contains a vulnerability allowing an attacker to write 4 bytes at a controlled place in memory (such as some integer overflows leading to out-of-bounds write), may be exploited to allow arbitrary code execution.
    To prevent the above mentioned security weakness, we need to ensure that the linker resolves all dynamically linked functions at the beginning of the execution, and then makes the GOT read-only.  This technique is called RELRO and ensures that the GOT cannot be overwritten in vulnerable ELF binaries.

    RELRO can be turned on when compiling a program by using the following options:

    ```bash
    gcc -g -O0 -Wl,-z,relro,-z,now -o <binary_name> <source_code>
    ```

    The below command line enables relro along with other protections.

    ```bash
    go build -buildmode=pie -ldflags -extldflags=-Wl,-z,now,-z,relro
    ```
  severity: high
  exe_types:
    - genericbinary
    - x86_64-executable
    - x86_64-exec
    - gobinary
    - mips-executable
- id: CHECK_CANARY
  title: Missing Canary Protection
  description: |
    Canaries or canary words are known values that are placed between a buffer and control data on the stack to monitor buffer overflows. When the buffer overflows, the first data to be corrupted will usually be the canary, and a failed verification of the canary data will therefore alert of an overflow, which can then be handled, for example, by invalidating the corrupted data.
    Canary can be set in GCC with the following parameters:
    ```bash
    -fstack-protector enables protection, but only inserts protection for functions that have arrays in local variables
    -fstack-protector-all Enable protection, insert protection for all functions
    -fstack-protector-strong
    -fstack-protector-explicit Only protects functions with explicit stack_protect attribute
    -fno-stack-protector Disable protection.
    ```
  severity: medium
  exe_types:
    - genericbinary
    - x86_64-executable
    - x86_64-exec
    - mips-executable
    # W3.1 (rule-15 exception): dotnetbinary left the scope. has_canary on
    # PE comes from native CRT marker symbols or the load-config guard
    # flag; a pure-IL assembly carries neither by construction, so the
    # rule's only possible verdict there was the false "not protected" —
    # it fired on every benign managed DLL once exe_type moved. Mixed-mode
    # native code inside managed images was never checked either (their
    # exe_type was PE32/PE64), so no file that existed before loses a check.
- id: CHECK_RPATH
  title: Avoid rpath and runpath
  description: |
    The job of the dynamic linker and loader (ld.so) is to resolve the executable's dependencies on shared libraries and to load the required ones at run-time. It relies on the executable's NEEDED headers to find the shared libraries with a matching SONAME (which includes the library name and ABI version). The current library search path:
    - The RPATH binary header (set at build-time) of the library causing the lookup (if any)
    - The RPATH binary header (set at build-time) of the executable
    - The LD_LIBRARY_PATH environment variable (set at run-time)
    - The RUNPATH binary header (set at build-time) of the executable
    - /etc/ld.so.cache
    - Base library directories (/lib and /usr/lib)

    ## Why RPATH is an issue
    A problem arises when binary A defines a NEEDED dependency on libraries B.so.1 and C.so.2, while library B.so.1 depends on library C.so.1. This means parts of the code will use one version of a library and other parts another. The many versions of a library scenario is needed to deal with gradual migrations, but maintainers shuffle libraries around when dealing with such a situation and packages with RPATH could end up finding the wrong version of a dependent library, one with incompatible dependencies.

    Since RPATH is set at build-time, it can only be overridden with a rebuild or by setting the LD_LIBRARY_PATH variable and this turns packages using it into management problems:

    LD_LIBRARY_PATH can't be used because it has its own problems: it'll be inherited by all processes generated by the parent and is therefore also discouraged for distribution-wide use for its possible side-effects.

    Needing a rebuild means that all dependencies of the affected library would need to be rebuilt during any move, which is an unacceptable scenario for a distribution.
    This situation would be better dealt with by the dynamic linker, since maintainers would have a central place to inform all dependent packages where to find libraries during transitional periods.
  severity: medium
  exe_types:
    - genericbinary
    # W3.1 (rule-15 exception): dotnetbinary left the scope. RPATH/RUNPATH
    # are ELF loader concepts; has_rpath is only ever set by the ELF path,
    # so the check's only possible verdict on a managed PE was the false
    # "no rpath" — it would have fired on every managed DLL once exe_type
    # moved.
- id: CHECK_VIRTUAL_SIZE
  title: Optimize binary virtual size
  description: |
    Checks the binary virtual size when mapped in memory (default 30MB).
    Use a packer such as [upx](https://github.com/upx/upx) to compress your binaries.
    For gcc, use flags such as `-s`, `-Os` or strip unwanted comment and build id sections from your ELF binaries.
    When you compile and link your Go programs with the gc toolchain on Linux, macOS, FreeBSD or NetBSD, the resulting binaries contain DWARFv4 debugging information that recent versions (≥7.5) of the GDB debugger can use to inspect a live process or a core dump.
    Use the -s and -w linker flags to strip the debugging information
    ```
    go build -ldflags="-s -w" main.go
    ```
  severity: medium
  limit: 30MB
  exe_types:
    - genericbinary
    - gobinary
    # W3.1 review: this scope predates the packet and did not move, but
    # the files reaching it did — managed PEs were PE32/PE64 and out of
    # scope before W3.1 and are in scope now. Kept: virtual size is a
    # format-independent fact and the check reads nothing native. Zero
    # findings added across the managed corpus (no assembly near 30 MB).
    - dotnetbinary
    - x86_64-executable
    - x86_64-exec
- id: CHECK_AUTHENTICODE
  title: Missing Authenticode
  description: |
    Authenticode is a digital signature format that is used to determine the origin and integrity of software binaries. Authenticode is based on Public-Key Cryptography Standards (PKCS) #7 signed data and X.509 certificates to bind an Authenticode-signed binary to the identity of a software publisher.
    At its core, Authenticode supplies (or can supply, as optional features) a number of properties for signed programs:
    * Authenticity
    * Integrity
    * Timeliness
    This check is catalog-aware (code_signature.scope) and its finding states which of three states it fired on: (1) an embedded signature blob that failed verification; (2) no embedded signature with a catalog lookup performed and negative against the supplied --catalog-dir directory — the only state from which "unsigned" is actually claimed; (3) an embedded signature whose signer could not be read. It does not fire when no catalog directory was supplied (catalog_lookup "not_performed") or when the catalog index was incomplete ("index_incomplete"): a catalog-signed file cannot be distinguished from an unsigned one without a directory, and "not found in the part of the index we built" is not "not signed".
  severity: high
  exe_types:
    - PE32
    - PE64
    - gobinary
    - dotnetbinary
    - x86_64-executable
    - x86_64-exec
- id: CHECK_SIGNATURE_NOT_TIMESTAMPED
  title: Signature Not Timestamped
  description: |
    An Authenticode signature without a countersignature timestamp stops being verifiable the moment the signing certificate expires: without a timestamp there is no proof the signature existed while the certificate was valid, so the signature is only as durable as the certificate behind it. Short-lived certificates (some CAs issue certificates valid for days) make this a durability question rather than an exceptional one.
    The check reports signatures that carry neither an RFC 3161 countersignature nor a legacy PKCS#9 countersignature. Nested signatures inherit the outer signature's timestamp, so a dual-signed binary is not double-counted. Validity relative to the timestamp is reported in the code_signature metadata; this rule is only about its absence.
  severity: medium
  exe_types:
    - PE32
    - PE64
    - gobinary
    - dotnetbinary
    - x86_64-executable
    - x86_64-exec
- id: CHECK_WEAK_SIGNATURE_DIGEST
  title: Weak Signature Digest
  description: |
    None of the Authenticode signatures embedded in this binary - including nested dual signatures - uses a modern digest (SHA-256 or stronger). SHA-1 and MD5 signature digests are susceptible to collision-based attacks that let an attacker substitute malicious content under a valid-looking signature.
    Dual signing (a SHA-1 outer signature with a SHA-256 signature nested inside it) is the normal shape for software that must run on older Windows, and is deliberately not reported: the nested signature carries the modern digest. Only a binary with no modern digest anywhere in its signature list is flagged.
  severity: high
  exe_types:
    - PE32
    - PE64
    - gobinary
    - dotnetbinary
    - x86_64-executable
    - x86_64-exec
- id: CHECK_SELF_SIGNED
  title: Self-Signed Signature
  description: |
    This binary's Authenticode signature was made by a certificate that is its own root: no certificate authority stands behind the identity it states. Anyone can create such a certificate in minutes and name it however they like - "Microsoft Corporation" included - so a self-signed signature authenticates the file to itself and to nothing else.
    Self-signing is common and legitimate for internal tools, test builds and installers signing their own components, which is why this is not a verdict on intent; it means the identity on the signature was never vouched for by anyone. Treat every identity claim on this binary (signer name, CompanyName, opus info) as self-asserted.
    This check follows the code_signature signing_class verdict and stays silent when the signature walk was truncated, so a sample of the signature list never decides it.
  severity: medium
  exe_types:
    - PE32
    - PE64
    - gobinary
    - dotnetbinary
    - x86_64-executable
    - x86_64-exec
- id: CHECK_SIGNATURE_UNKNOWN_ROOT
  title: Signature Chain Outside Shipped Root Snapshot
  description: |
    This binary's signature chain ships all the way to a self-signed root certificate, and that root's SHA-256 fingerprint is not in blint's shipped root snapshot - the trusted root certificates hashed from a Windows machine's Root and AuthRoot stores at a recorded date and build (blint/data/pe_roots.yml). The chain anchors nowhere blint can name.
    This is a statement about the file, not a trust verdict: blint performs no trust validation, consults no live certificate store and fetches no revocation data, so "outside the shipped snapshot" also covers roots created after the snapshot was taken. A signature whose chain stops below the root - the normal shape for Authenticode - is never reported here, because the blob not carrying a root says nothing about the root.
    Combined with a self-signed signer or a certificate from a private CA, this is the shape of a signature that only pretends to a publisher identity.
  severity: high
  exe_types:
    - PE32
    - PE64
    - gobinary
    - dotnetbinary
    - x86_64-executable
    - x86_64-exec
- id: CHECK_KERNEL_SIGNING_CLASS
  title: Kernel-Mode Code Signing
  description: |
    The signature's certificate carries the kernel-mode code signing EKU (1.3.6.1.4.1.311.61.1.1): the binary is signed for execution as a kernel component (or claims to be). This is an informational posture finding, not a defect: kernel code runs with the operating system's privileges, so a kernel-signed binary is a high-value artifact for both legitimate drivers and abuse (the BYOVD pattern loads a legitimately signed but vulnerable driver).
    blint derives the class from the certificate's EKU and shipped chain facts; it does not verify the signature's trust. See code_signature.signing_class.
  severity: low
  exe_types:
    - PE32
    - PE64
    - gobinary
    - dotnetbinary
    - x86_64-executable
    - x86_64-exec
- id: CHECK_SIGNER_MISMATCH
  title: Signature Signer Does Not Match Company Claim
  description: |
    The VERSIONINFO CompanyName claims a well-known publisher, but the Authenticode signature was made by a different identity - the shape of a signed-but-repurposed binary: someone re-signed the file with their own certificate and left the original version strings in place.
    The comparison is deliberately one-directional and narrow. It fires only when the CompanyName claims a publisher from blint's identity table (blint/data/pe_publisher_identities.yml) whose tokens the signer does not carry. The reverse - a large publisher signing software whose CompanyName names an acquired brand or an upstream project (Microsoft signs the Sysinternals suite, the Python Software Foundation signs the OpenSSL DLLs it ships) - is normal and is never a finding: measured on a benign corpus, 152 of 178 files with both facts have differing names, and every one of them is legitimate. A signer/CompanyName pair outside the table is not arbitrated at all, because a name difference between two unknown identities is not evidence.
  severity: high
  exe_types:
    - PE32
    - PE64
    - gobinary
    - dotnetbinary
    - x86_64-executable
    - x86_64-exec
- id: CHECK_DLL_CHARACTERISTICS
  title: Missing dll Security Characteristics
  description: |
    NX_COMPAT: Image is NX compatible.
    FORCE_INTEGRITY: Code Integrity checks are enforced.
    HIGH_ENTROPY_VA: Image can handle a high entropy 64-bit virtual address space.
    GUARD_CF: Image supports Control Flow Guard.
    DYNAMIC_BASE: DLL can be relocated at load time.

    Control Flow Guard (CFG) is a highly-optimized platform security feature that was created to combat memory corruption vulnerabilities. By placing tight restrictions on where an application can execute code from, it makes it much harder for exploits to execute arbitrary code through vulnerabilities such as buffer overflows.

    - [PE format](https://docs.microsoft.com/en-us/windows/win32/debug/pe-format#dll-characteristics)
    - [Control Flow Guard](https://docs.microsoft.com/en-gb/windows/win32/secbp/control-flow-guard)
  severity: high
  mandatory_values:
    - HIGH_ENTROPY_VA
    - NX_COMPAT
    - GUARD_CF
    - FORCE_INTEGRITY
    - DYNAMIC_BASE
  exe_types:
    - PE32
    - PE64
    - dotnetbinary
    - gobinary
- id: CHECK_CODESIGN
  title: Missing Code Signing
  description: |
    Code signing is a macOS security technology that you use to certify that an app was created by you. Once an app is signed, the system can detect any change to the app—whether the change is introduced accidentally or by malicious code.
    You participate in code signing as a developer when you obtain a signing identity and apply your signature to apps that you ship. A certificate authority (often Apple) vouches for your signing identity.
  severity: high
  exe_types:
    - MachO
    - genericbinary
    - gobinary
    - x86_64-executable
    - x86_64-exec
- id: CHECK_PROFILE_EXPIRED
  title: Expired Provisioning Profile
  description: |
    The binary ships inside a bundle whose embedded provisioning profile
    (embedded.mobileprovision / embedded.provisionprofile) has passed its
    ExpirationDate. The profile is what ties the code signature to a signing
    identity and an app ID; once it lapses the app stops launching (or stops
    distributing, for enterprise builds). Expiry is evaluated at scan time
    from the profile's own dates.
  severity: high
  exe_types:
    - MachO
    - genericbinary
- id: CHECK_PROFILE_DEVELOPMENT
  title: Development Provisioning Profile Shipped
  description: |
    The binary ships inside a bundle whose embedded provisioning profile is
    a development profile: it signs the get-task-allow entitlement, which
    lets any entitled debugger attach to the shipping binary, and it only
    runs on the devices listed in the profile. Release and distribution
    builds must be signed with a distribution profile instead.
  severity: medium
  exe_types:
    - MachO
    - genericbinary
- id: CHECK_PROFILE_WILDCARD
  title: Wildcard Provisioning Profile
  description: |
    The binary ships inside a bundle whose embedded provisioning profile
    covers a wildcard application identifier (<team-id>.*). A wildcard lets
    the signing identity attest any bundle ID, which weakens what the
    signature proves about the shipping app.
  severity: medium
  exe_types:
    - MachO
    - genericbinary
- id: CHECK_TRUST_INFO
  title: Requires Elevated Execution
  description: |
    Identifies and checks the security level at which the application requests to be executed.

    - [trustInfo docs](https://docs.microsoft.com/en-us/visualstudio/deployment/trustinfo-element-clickonce-application?view=vs-2022)
  severity: high
  allowed_values:
    requestedExecutionLevel:
      level: asInvoker
      uiAccess: false
    PermissionSet:
      Unrestricted: false
  exe_types:
    - PE32
    - PE64
    - dotnetbinary
- id: CHECK_BUILD_PATH_LEAK
  title: Build Path Leaked in PDB Reference
  description: |
    The binary's debug directory references a PDB through an absolute
    build-machine path, publishing the build agent's directory tree with the
    shipped artifact. CI runs leak usernames, hostnames and internal layout
    this way (`D:\a\1\b\...` is Azure DevOps' work tree,
    `C:\Users\<name>\...` names the developer), which is provenance an
    attacker can use for reconnaissance or social engineering, and a
    reliable clustering key for tracking a vendor's builds.

    Fix the leak at the source: link with `/PDBALTPATH:%_PDB%` so the image
    stores a bare filename, or strip the debug directory from release
    builds. A relative path or a bare filename leaks no directory structure
    and is not reported.
  severity: low
  exe_types:
    - PE32
    - PE64
    - dotnetbinary
# CHECK_PAC, CHECK_PAC_STRICT, CHECK_XFG, CHECK_CET and CHECK_ENCLAVE were
# removed in the W0.3 rewrite (PE-lane A.3, verification finding V4). All five
# fired "missing <feature>" findings on nearly every PE — including every
# stock Microsoft-signed binary in the benign corpus and files blint could not
# even parse as PE — because their properties were read as False whenever
# omitted. The underlying properties are now computed from their named sources
# in security_properties (GuardFlags bit decode for cfg/xfg/rfg, the
# EX_DLLCHARACTERISTICS debug entry for cet_shadow_stack, the load
# configuration's enclave pointer for enclave presence), and no PE source
# exists at all for PAC — the GuardFlags RF bits are Return Flow Guard, not
# pointer authentication, and no Windows toolchain flag records PAC in a PE.
# An always-firing advisory on an opt-in feature is noise (ground rule 27);
# posture questions are answered by the metadata, and better-scoped rules can
# return with the driver/HVCI work (W5.2).
- id: CHECK_LIBC_PORTABILITY
  title: Depends on C Library Implementation Internals
  description: |
    The binary imports interfaces that are specific to one C library implementation rather than defined by a standard. Examples include loader introspection (`dl_iterate_phdr`, `dladdr`, `dlinfo`), backtrace support, allocator internals (`malloc_usable_size`, `mallinfo`), stdio internals (`fopencookie`) and the non-portable pthread extensions.
    These symbols have no equivalent in other C libraries, so the binary cannot be rebuilt against a different runtime, run in a distroless or musl-based image, or bundled as a portable artifact without a compatibility layer. The effect is usually discovered at deployment rather than at build time, because the link succeeds and only the load or the first call fails.
    Where the dependency is deliberate, record it as a supported runtime constraint. Where it is incidental — the most common case is a diagnostic path that pulls in `backtrace` — gate it behind a build option so the default build stays portable.
  severity: info
  exe_types:
    - genericbinary
    - x86_64-executable
    - x86_64-exec
    - gobinary
    - mips-executable
- id: CHECK_ABI_FLOOR
  title: Requires a Newer Runtime Than the Deployment Baseline
  description: |
    Every versioned symbol a binary imports carries a minimum version of the library that provides it. The highest such version across all imports is the floor: the binary will not start on any host whose runtime is older, and the failure is a load-time error naming a version node rather than anything actionable.
    This finding fires when that floor is higher than the configured baseline. A single import raising the floor is common and usually accidental — building on a newer distribution than the one being targeted is enough to do it.
    Fix it by building against the oldest runtime you intend to support, or by pinning the affected symbols to an older version node. The `internal:abi_determining_symbols` property on the component records exactly which imports set the floor.
  severity: medium
  baseline_version: "2.28"
  exe_types:
    - genericbinary
    - x86_64-executable
    - x86_64-exec
    - mips-executable
- id: CHECK_RUNTIME_LOADING
  title: Loads Libraries That Are Not Declared Dependencies
  description: |
    The binary opens shared libraries at runtime by name. Those libraries never appear in the dynamic dependency table, so a dependency list, an SBOM, or a vulnerability scan built from that table alone omits them entirely — and they are frequently the components that matter most, since drivers, codecs, authentication modules and cryptographic providers are almost always loaded on demand.
    There is a second consequence: a library resolved by name at runtime is subject to the full library search path at the moment of the call, which is a wider trust boundary than the one that applied at link time.
    Declare these dependencies explicitly so downstream consumers can see them, and prefer an absolute path over a bare name when the location is known.
  severity: info
  exe_types:
    - genericbinary
    - x86_64-executable
    - x86_64-exec
    - gobinary
    - mips-executable
- id: CHECK_LINK_CLOSURE
  title: Dynamic Dependencies Cannot Be Fully Resolved
  description: |
    Resolving the dependency closure the way the loader would left either a required library that nothing on the search path supplies, or imported symbols that no library in the closure defines. Both are load-time failures: the process will not start, and the error names one missing symbol rather than the missing library behind it.
    A missing library usually means a packaging gap — a runtime dependency the package metadata does not declare. Unresolved symbols usually mean a version skew: a library is present, but an older build of it than the one the binary was linked against.
    This check only runs when closure resolution is enabled, and its result describes the filesystem it resolved against. Point it at the image the binary actually ships in rather than at a build host.
  severity: high
  exe_types:
    - genericbinary
    - x86_64-executable
    - x86_64-exec
    - mips-executable
- id: CHECK_SEARCH_PATH
  title: Library Search Path Includes an Untrusted Directory
  description: |
    An `RPATH` or `RUNPATH` entry is relative, empty, or points inside a world-writable directory. Any of these lets a directory outside the package decide which library the loader binds first, which turns library loading into an arbitrary code execution path for whoever can write there.
    An empty entry in the list is the sharpest form of this: the loader reads it as the current working directory, so the binary loads whatever happens to be alongside it when it is run.
    Remove the entry, or replace it with an absolute path under a directory only root can write to. Where the library genuinely lives next to the binary, use `$ORIGIN` so the path is resolved relative to the executable rather than to the caller's working directory.
  severity: high
  exe_types:
    - genericbinary
    - x86_64-executable
    - x86_64-exec
    - gobinary
    - mips-executable
- id: CHECK_UNUSED_DEPENDENCIES
  title: Declared Dependency Is Never Used
  description: |
    The binary declares a dependency on a library from which it imports no symbol. The loader will still map the library and everything that library itself needs, so the dependency costs startup time and resident memory, appears in every dependency list and SBOM built from the binary, and produces vulnerability matches against code the program never calls.
    This almost always comes from the link line rather than the source: a library passed to the linker is recorded as a dependency whether or not anything from it is referenced, and the entry is then inherited by everything that links against the result. Distributions that link with `--as-needed` by default are largely free of it, which is why the same source can be clean on one platform and not another.
    Link with `-Wl,--as-needed` so the linker records only the libraries that actually resolve a symbol, or remove the library from the link line.
  severity: low
  exe_types:
    - genericbinary
    - x86_64-executable
    - x86_64-exec
    - MachO
    - mips-executable
- id: CHECK_UNDECLARED_DEPENDENCIES
  title: Used Library Is Not a Declared Dependency
  description: |
    The binary imports symbols from a library it does not declare a dependency on. It works today because some other dependency pulls that library in, so the loader happens to have it mapped by the time the symbol is bound.
    That is not a contract. If the intermediate library drops its own dependency, switches to a different implementation, or is itself linked with `--as-needed`, this binary stops resolving for reasons unconnected to any change made to it. The failure appears at load time and names a symbol rather than the library behind it, so it is slow to diagnose.
    It also understates the dependency list: the library is a real component of this binary and will be missing from any SBOM, licence review, or vulnerability scan built from the declared dependencies.
    Add the library to the link line so the dependency is recorded explicitly.
  severity: medium
  exe_types:
    - genericbinary
    - x86_64-executable
    - x86_64-exec
    - MachO
    - mips-executable
    # W3.2: a managed binary's used/declared sets are its P/Invoke surface
    # and its ImplMap scopes — inputs W3.1 first read and this packet wires
    # into the dependency graph, so the check now evaluates managed images
    # on evidence instead of being out of scope for them. A DllImport scope
    # is itself the declaration, so a pure-IL assembly computes clean; the
    # shape that can fire is a used native library the managed metadata
    # never declared (mixed-mode images with an import table).
    - dotnetbinary
- id: CHECK_PACKED
  title: Binary Shows Packing Evidence
  description: |
    The binary carries evidence consistent with packing or self-encryption: a packer-specific section signature (UPX, Themida, VMProtect and friends), high-entropy executable sections combined with a minimal import table, or an unclassifiable high-entropy file overlay past the last section that another packing signal corroborates.
    Packers exist for legitimate reasons - software protection, game anti-cheat - but they are also the single most common way malware hides its real code from static analysis. A packed binary defeats string-based reviews, symbol matching and most of the disassembly pipeline, so every finding in this report should be read as incomplete until the binary is unpacked.
    Review the packing evidence in the `entropy` block of the metadata, confirm the binary's provenance, and unpack it (for example with `upx -d` when UPX is identified) before drawing security conclusions from the analysis.
  severity: warning
  exe_types:
    - genericbinary
    - x86_64-executable
    - x86_64-exec
    - MachO
    - PE32
    - PE64
    # W3.1 review: managed images must stay in scope. The evidence is
    # section entropy, packer section signatures and the overlay — all
    # computed for any PE, none of them native-only — and a packed or
    # obfuscator-protected .NET assembly is one of the commonest hostile
    # managed shapes there is. Moving managed files to dotnetbinary took
    # this check away from them silently; restoring the scope costs
    # nothing, as all 62 managed corpus files score packed_likelihood low.
    - dotnetbinary
