---
text: Review for symbols identified in a binary produced by GNU build
group: SYMBOL_REVIEWS
exe_type: genericbinary
rules:
  - id: CLIPBOARD_ACCESS_API
    title: Clipboard api functions used
    summary: Can Manipulate Clipboard
    description: |
      Libraries such as SDL is used to monitor clipboard.
    patterns:
      - SDL_SetClipboardText
      - SDL_GetClipboardText
      - SDL_HasClipboardText
  - id: AUDIO_ACCESS_API
    title: Audio Hardware api functions used
    summary: Can Manipulate Audio Hardware
    description: |
      Libraries such as SDL is used to manipulate audio devices.
    patterns:
      - SDL_GetNumAudioDrivers
      - SDL_GetAudioDriver
      - SDL_AudioInit
      - SDL_GetCurrentAudioDriver
      - SDL_OpenAudio
      - SDL_GetNumAudioDevices
      - SDL_GetAudioDeviceName
      - SDL_GetAudioDeviceSpec
      - SDL_OpenAudioDevice
      - SDL_GetAudioStatus
      - SDL_GetAudioDeviceStatus
      - SDL_PauseAudio
      - SDL_PauseAudioDevice
      - SDL_LoadWAV_RW
      - SDL_FreeWAV
      - SDL_LoadWAV
      - SDL_BuildAudioCVT
      - SDL_ConvertAudio
      - SDL_NewAudioStream
      - SDL_AudioStreamPut
      - SDL_AudioStreamGet
      - SDL_AudioStreamAvailable
      - SDL_AudioStreamFlush
      - SDL_AudioStreamClear
      - SDL_FreeAudioStream
      - SDL_MixAudio
      - SDL_MixAudioFormat
      - SDL_QueueAudio
      - SDL_DequeueAudio
      - SDL_GetQueuedAudioSize
      - SDL_ClearQueuedAudio
      - SDL_LockAudio
      - SDL_LockAudioDevice
      - SDL_UnlockAudio
      - SDL_UnlockAudioDevice
      - SDL_CloseAudio
      - SDL_CloseAudioDevice
  - id: VIDEO_ACCESS_API
    title: Video Hardware api functions used
    summary: Can Manipulate Video Hardware
    description: |
      Libraries such as SDL is used to manipulate video devices.
    patterns:
      - SDL_GetNumVideoDrivers
      - SDL_GetVideoDriver
      - SDL_VideoInit
      - SDL_VideoQuit
      - SDL_GetCurrentVideoDriver
      - SDL_GetNumVideoDisplays
      - SDL_GetDisplayName
      - SDL_GetDisplayBounds
      - SDL_GetDisplayUsableBounds
      - SDL_GetDisplayDPI
      - SDL_GetNumDisplayModes
      - SDL_GetDisplayMode
      - SDL_GetDesktopDisplayMode
      - SDL_GetCurrentDisplayMode
      - SDL_GetClosestDisplayMode
      - SDL_GetWindowDisplayIndex
      - SDL_SetWindowDisplayMode
      - SDL_GetWindowDisplayMode
      - SDL_GetWindowICCProfile
      - SDL_GetWindowPixelFormat
      - SDL_CreateWindow
      - SDL_CreateWindowFrom
      - SDL_GetWindowID
      - SDL_GetWindowFromID
      - SDL_GetWindowFlags
      - SDL_SetWindowTitle
      - SDL_GetWindowTitle
      - SDL_SetWindowData
      - SDL_GetWindowData
      - SDL_ShowWindow
      - SDL_GetWindowSurface
      - SDL_SetWindowInputFocus
      - SDL_EnableScreenSaver
      - SDL_DisableScreenSaver
      - SDL_GL_LoadLibrary
      - SDL_GL_GetProcAddress
      - SDL_GL_UnloadLibrary
      - SDL_GL_ExtensionSupported

  - id: FORTIFIED_LIBC_IN_USE
    title: Fortified libc calls compiled in (_FORTIFY_SOURCE)
    summary: Binary was built with libc hardening checks enabled
    description: |
      The binary imports glibc/musl fortified function variants (__printf_chk,
      __memcpy_chk, __read_chk, ... or musl's __fortify_fail), which the
      compiler emits only when built with -D_FORTIFY_SOURCE=2 or 3 and
      optimization enabled. This is a positive hardening posture fact, not an
      accusation: the checks add buffer-size validation to risky libc calls at
      the cost of nothing observable statically. Distributions build their
      system packages with it by default, so expect this on most distro-built
      ELFs and read its absence on a C/C++ binary as "not built with
      FORTIFY_SOURCE" - a missed hardening opportunity, never proof of
      malice. __stack_chk_* is deliberately NOT in the pattern list: it is the
      stack protector's signal (CHECK_CANARY), a different hardening feature
      that ships independently. Note glibc only calls the _chk variant when
      the compiler cannot prove the buffer size safe, so a fortified build
      may legitimately show no _chk imports at all (measured: the same
      program compiled -O2 -D_FORTIFY_SOURCE=2 on glibc 12 emits only
      __fprintf_chk while its memory calls were proven safe and inlined).
    severity: info
    patterns:
      - __printf_chk
      - __fprintf_chk
      - __sprintf_chk
      - __snprintf_chk
      - __vprintf_chk
      - __vfprintf_chk
      - __vsprintf_chk
      - __vsnprintf_chk
      - __memcpy_chk
      - __memmove_chk
      - __memset_chk
      - __strcpy_chk
      - __strncpy_chk
      - __strcat_chk
      - __strncat_chk
      - __stpcpy_chk
      - __stpncpy_chk
      - __read_chk
      - __recv_chk
      - __recvfrom_chk
      - __pread_chk
      - __pread64_chk
      - __fdelt_chk
      - __fortify_fail
