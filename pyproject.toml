[project]
name = "blint"
version = "4.0.0"
description = "Linter and SBOM generator for binary files."
authors = [
    {name= "Team AppThreat", email = "cloud@appthreat.com"},
]
dependencies = [
    "lief>=0.17.4",
    "rich>=15.0.0",
    "PyYAML>=6.0.3",
    "defusedxml>=0.7.1",
    "pydantic[email]>=2.13.3",
    "orjson>=3.11.7",
    "multi-demangle>=2.1.0",
    "ar>=1.0.1",
    "custom-json-diff>=2.1.6",
    "apkInspector>=1.3.6",
    "appdirs>=1.4.4",
    "apsw>=3.53.0.0",
    "packageurl-python>=0.17.6",
    "oras>=0.2.41",
    "wasm-tools>=2.1.0",
]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/owasp-dep-scan/blint"
repository = "https://github.com/owasp-dep-scan/blint"
keywords = ["linter", "binary", "security", "sast"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Utilities",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10,<3.15"
include = ["blint/data/*.yml"]

[project.urls]
"CI" = "https://github.com/owasp-dep-scan/blint/actions"

[project.scripts]
blint = 'blint.cli:main'

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.0",
    "flake8>=7.3.0",
    "pylint>=4.0.5",
    "pytest-cov>=7.1.0",
    "pyinstaller>=6.20.0"
]

[tool.ruff]
line-length = 99
# Generated by datamodel-codegen from the CycloneDX JSON schema (see
# blint/cyclonedx/README.md). Hand edits are lost on the next regeneration,
# so it is linted by neither tool — pylint's ignore-paths says the same.
extend-exclude = ["blint/cyclonedx/spec.py"]

[tool.ruff.lint]
ignore = [
    # blint is best-effort by design: a malformed section, an unreadable
    # file or a SQLite hiccup degrades one finding, it does not fail a scan.
    # Every one of these sites logs and continues on purpose, so the broad
    # except is the contract rather than an oversight.
    "BLE001",
    "S110",
    "S112",
    # Raising ValueError where a TypeError is conventional. Changing the
    # exception type is a behaviour change for callers, not a lint fix.
    "TRY004",
    # Every remaining site has a comment between the two conditions
    # explaining why the inner test is separate, which is why ruff itself
    # declines to collapse them. The comment is worth more than the nesting.
    "SIM102",
]

[tool.ruff.lint.per-file-ignores]
# Tests and harnesses inspect a failing command's output on purpose; an
# exception on a nonzero exit would throw away the thing being asserted.
# RUF012/RUF059: stand-in classes for lief objects and deliberately partial
# tuple unpacking in assertions — neither is a defect in a test double.
"tests/**" = ["PLW1510", "RUF012", "RUF059"]

[tool.ruff.format]
# Match the previous formatter defaults so existing files are not churned.
quote-style = "double"
indent-style = "space"

[tool.poetry.group.extended.dependencies]
nyxstone = "^0.1.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--verbose --cov-append --cov-report term --cov blint"
markers = [
    "slow: spawns subprocesses or re-runs whole scans; run locally, deselected in CI with -m 'not slow'",
]

[tool.pylint]
generated-members = ["lief", "orjson"]
ignore-paths = ["blint/cyclonedx/*", "tests/*"]
# Let's not fuss about long strings
ignore-long-lines = "[r|f]\""
disable = ["missing-module-docstring", "logging-fstring-interpolation"]

[tool.pylint.format]
max-line-length = 99

[tool.pylint.design]
max-args = 6
max-nested-blocks = 6
