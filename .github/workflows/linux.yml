name: Build Linux Binaries

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  Blint-GNU-Build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary_name: blint-linux-amd64
          - os: ubuntu-24.04-arm
            binary_name: blint-linux-arm64
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        path: blint
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.13'
    - name: Linux packages
      run: |
        sudo apt-get update
        sudo apt-get install zlib1g-dev libzstd-dev llvm-18 llvm-18-dev
    - name: Install poetry
      id: poetry
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install setuptools pyinstaller poetry
        cd blint
        poetry config virtualenvs.create false
        poetry install --all-groups --all-extras --no-cache
      env:
        NYXSTONE_LLVM_PREFIX: /usr/lib/llvm-18
    - name: Binary gnu build
      run: |
        cd blint
        pyinstaller blint/cli.py --noconfirm --log-level=WARN \
          --nowindow \
          --onefile \
          --name ${{ matrix.binary_name }} \
          --add-data="blint/data:blint/data" \
          --add-data="blint/data/annotations:blint/data/annotations" \
          --collect-submodules blint \
          --collect-submodules multi-demangle \
          --collect-submodules oras \
          --collect-all nyxstone \
          --hidden-import nyxstone_cpp \
          --noupx
        # Confirm the bundled disassembler is available in the frozen binary
        ./dist/${{ matrix.binary_name }} --help >/dev/null
        ./dist/${{ matrix.binary_name }} -i dist/${{ matrix.binary_name }} -o /tmp/reports
        # A frozen build re-executes the entry in every pool worker; without
        # freeze_support in main() this scan dies importing lief, so keep it
        # in the smoke path for --jobs and the --cache apsw store.
        BLINT_CACHE_DIR=/tmp/blint-smoke-cache ./dist/${{ matrix.binary_name }} --no-banner -q --jobs 2 --cache -i dist/${{ matrix.binary_name }} -o /tmp/reports-jobs
        sha256sum ./dist/${{ matrix.binary_name }} > ./dist/${{ matrix.binary_name }}.sha256
      env:
        PYTHONIOENCODING: utf-8
        LANG: en_US.utf-8
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        path: ./blint/dist
        name: ${{ matrix.binary_name }}
    - name: Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          blint/dist/${{ matrix.binary_name }}
          blint/dist/${{ matrix.binary_name }}.sha256    
