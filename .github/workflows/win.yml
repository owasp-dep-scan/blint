name: Build Windows Binaries

# merge_group lets the merge queue re-run the required Blint-Build check on
# the speculative merge commit.
on:
  push:
    branches:
      - main
      - release/*
    tags:
      - 'v*'
  pull_request:
  merge_group:
  workflow_dispatch:
permissions: {}
jobs:
  Blint-Build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        path: blint
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30  # v2.0.1
      with:
        cache: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.14'
    - name: Install poetry
      id: poetry
      run: |
        python -m pip install --upgrade pip
        python -m pip install setuptools pyinstaller tzdata poetry
        cd blint
        poetry config virtualenvs.create false
        poetry install --without=extended --no-cache
    - name: Binary windows build
      run: |
        cd blint
        pyinstaller blint/cli.py --noconfirm --log-level=WARN --nowindow --onefile --name blint --add-data="blint/data;blint/data" --add-data="blint/data/annotations;blint/data/annotations" --collect-submodules blint --collect-submodules multi-demangle --collect-submodules oras --disable-windowed-traceback -i blint.ico --version-file=file_version_info.txt --noupx
        (Get-FileHash .\dist\blint.exe).hash | Out-File -FilePath .\dist\blint.exe.sha256
        set PYTHONIOENCODING=UTF-8
        .\dist\blint.exe -i .\dist\blint.exe -o reports --no-banner
        # Frozen worker-pool and parse-cache smoke; see the linux workflow note.
        $env:BLINT_CACHE_DIR = "$env:TEMP\blint-smoke-cache"
        .\dist\blint.exe --no-banner -q --jobs 2 --cache -i .\dist\blint.exe -o reports-jobs
      env:
        PYTHONIOENCODING: utf-8
        LANG: en_US.utf-8
        PYTHONUTF8: 1
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        path: blint/dist
        name: blint-windows
    - name: Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          blint/dist/blint.exe
          blint/dist/blint.exe.sha256