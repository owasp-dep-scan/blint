name: Build Linux Musl Binaries

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  Blint-Musl-Build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary_name: blint-linux-musl-amd64
          - os: ubuntu-24.04-arm
            binary_name: blint-linux-musl-arm64
    permissions:
      contents: write
      packages: write
      id-token: write
    # Alpine 3.20 ships LLVM 18, matching the GNU/PyPI build toolchain.
    container: alpine:3.20
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      with:
        path: blint
        persist-credentials: false
    - name: Install packages
      run: |
        apk update
        apk add --no-cache \
          python3 python3-dev py3-pip \
          build-base cmake make git \
          musl-dev libffi-dev openssl-dev zlib-dev zstd-dev xz \
          llvm18-dev llvm18-static clang18 \
          ncurses-dev libxml2-dev
    # nyxstone ships only sdists, so it must be compiled against LLVM 18.
    - name: Install poetry
      run: |
        python3 -m pip install --break-system-packages --upgrade pip
        python3 -m pip install --break-system-packages setuptools pyinstaller poetry
        cd blint
        poetry config virtualenvs.create false
        poetry install --all-groups --all-extras --no-cache
      env:
        NYXSTONE_LLVM_PREFIX: /usr/lib/llvm18
    - name: Binary musl build
      run: |
        cd blint
        pyinstaller blint/cli.py --noconfirm --log-level=WARN \
          --nowindow \
          --onefile \
          --name ${{ matrix.binary_name }} \
          --add-data="blint/data:blint/data" \
          --add-data="blint/data/annotations:blint/data/annotations" \
          --collect-submodules blint \
          --collect-submodules multi-demangle \
          --collect-submodules oras \
          --collect-all nyxstone \
          --hidden-import nyxstone_cpp \
          --noupx
        # Confirm the bundled disassembler is available in the frozen binary
        ./dist/${{ matrix.binary_name }} --help >/dev/null
        ./dist/${{ matrix.binary_name }} -i dist/${{ matrix.binary_name }} -o /tmp/reports
        sha256sum ./dist/${{ matrix.binary_name }} > ./dist/${{ matrix.binary_name }}.sha256
      env:
        PYTHONIOENCODING: utf-8
        LANG: en_US.utf-8
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        path: ./blint/dist
        name: ${{ matrix.binary_name }}
    - name: Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          blint/dist/${{ matrix.binary_name }}
          blint/dist/${{ matrix.binary_name }}.sha256
